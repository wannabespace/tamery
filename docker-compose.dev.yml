services:
  db:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tamery
    command: [postgres, -c, wal_level=logical]
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
      - '127.0.0.1:8001:8001'
    environment:
      - REDIS_ARGS=--requirepass root
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, -a, root, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stands in for the chat attachments bucket (`S3_*` in `apps/api/.env`).
  s3:
    image: adobe/s3mock:5.2.3
    # The image runs as uid 1000, which cannot write to a root-owned volume.
    user: root
    restart: unless-stopped
    ports:
      - '9090:9090'
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=tamery-attachments
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/data
    volumes:
      - s3_data:/data

  # The agent eval's databases (`packages/evals`), seeded by its runner: `docker compose -f docker-compose.dev.yml --profile evals up -d`.
  eval-postgres:
    image: postgres:18-alpine
    profiles: [evals]
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shop

  eval-mysql:
    image: mysql:8.4
    profiles: [evals]
    command: [--innodb-buffer-pool-size=64M, --performance-schema=OFF]
    ports:
      - '3307:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shop
      - MYSQL_INITDB_SKIP_TZINFO=1

  eval-mongodb:
    image: mongo:8.0
    profiles: [evals]
    ports:
      - '27018:27017'

volumes:
  postgres_data:
  redis_data:
  s3_data:
