version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # Needs @tanstack/db 1.0 while the app is on 0.15 (#636).
      - dependency-name: "@tanstack/offline-transactions"
        versions: [">=1.2.0"]
      # 2.x parses asynchronously in a Worker; run.ts evaluates synchronously (#689).
      - dependency-name: "@mongodb-js/shell-bson-parser"
        versions: [">=2.0.0"]
      # @vitejs/plugin-react 6.1 accepts only ^0.1.7 || ^0.2.0.
      - dependency-name: "@rolldown/plugin-babel"
        versions: [">=0.3.0"]
    groups:
      dependencies:
        patterns: ["*"]
