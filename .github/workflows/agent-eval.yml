name: Agent eval

# Manual only: every run spends model tokens.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Run only the cases whose id contains this (e.g. mongodb/ or /revenue)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5434:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop
        ports:
          - 3307:3306
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-retries 30
      mongodb:
        image: mongo:8.0
        ports:
          - 27018:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the eval
        working-directory: packages/evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run.ts --only "${{ inputs.only }}" | tee "$GITHUB_STEP_SUMMARY"
