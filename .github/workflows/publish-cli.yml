name: Build and publish CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macOS, so the darwin binaries can be re-signed. Intel, because it cross-compiles every target anyway and macOS arm64
    # runners can stay unavailable long enough that GitHub cancels the job.
    runs-on: macos-26-intel
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - run: pnpm i --frozen-lockfile --ignore-scripts

      - run: pnpm run check

      - name: Test
        working-directory: apps/cli
        run: bun test

      - name: Build every target
        working-directory: apps/cli
        run: bun scripts/build.ts --all
        env:
          API_URL: ${{ secrets.API_URL }}
          MAIN_URL: ${{ secrets.MAIN_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}

      # A cross-compiled darwin binary carries an invalid signature, and macOS kills an arm64 one on start.
      - name: Sign macOS binaries (ad hoc)
        working-directory: apps/cli/dist
        run: codesign --force --sign - tamery-darwin-arm64 tamery-darwin-x64

      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version apps/cli/package.json)" >> "$GITHUB_OUTPUT"

      # A tar, since an artifact drops the executable bit the npm packages and smoke tests need.
      - run: tar -cf dist.tar -C apps/cli dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar

  smoke-test:
    needs: build
    strategy:
      matrix:
        include:
          - runner: macos-latest
            binaries: tamery-darwin-arm64
          - runner: macos-26-intel
            binaries: tamery-darwin-x64
          - runner: ubuntu-latest
            binaries: tamery-linux-x64
            alpine: tamery-linux-x64-musl
          - runner: ubuntu-24.04-arm
            binaries: tamery-linux-arm64
            alpine: tamery-linux-arm64-musl
          - runner: windows-latest
            binaries: tamery-windows-x64.exe
          - runner: windows-11-arm
            binaries: tamery-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar

      - name: Run the binary
        working-directory: dist
        run: |
          binary="./${{ matrix.binaries }}"
          test "$($binary --version)" = "$VERSION"
          $binary bridge --help | grep -q -- --public-url

      # Alpine leaves libstdc++ out, which Bun's musl build links; the install script tells users to add it.
      - name: Run the musl binary on Alpine
        if: matrix.alpine
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:latest sh -c "
            apk add -q libstdc++ &&
            test \"\$(/dist/${{ matrix.alpine }} --version)\" = '$VERSION' &&
            /dist/${{ matrix.alpine }} bridge --help | grep -q -- --public-url
          "

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # A prerelease goes to npm's `next` tag, which npm refuses to guess: `latest` is what the install scripts and
    # `tamery update` install for everyone not already on a prerelease.
    env:
      VERSION: ${{ needs.build.outputs.version }}
      NPM_TAG: ${{ contains(needs.build.outputs.version, '-') && 'next' || 'latest' }}
      PRERELEASE: ${{ contains(needs.build.outputs.version, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: dist

      - run: tar -xf dist.tar -C apps/cli

      - name: Write checksums
        working-directory: apps/cli/dist
        run: shasum -a 256 tamery-* > checksums.txt

      # Before npm: the install scripts read the version from npm and download it from this release.
      - name: Create GitHub release
        working-directory: apps/cli/dist
        env:
          GH_TOKEN: ${{ github.token }}
        # --latest=false: the desktop app's releases live in this repo and stay the latest. A rerun after a failed npm
        # publish replaces the assets of the release it already created.
        run: |
          if gh release view "cli-v$VERSION" >/dev/null 2>&1; then
            gh release upload "cli-v$VERSION" tamery-* checksums.txt --clobber
          else
            gh release create "cli-v$VERSION" tamery-* checksums.txt \
              --target "$GITHUB_SHA" \
              --title "Tamery CLI $VERSION" \
              --notes "Update: \`tamery update\`. Install: \`curl -fsSL https://tamery.app/cli/install.sh | sh\` (macOS, Linux), \`irm https://tamery.app/cli/install.ps1 | iex\` (Windows) or \`npm i -g tamery\`." \
              --prerelease="$PRERELEASE" \
              --latest=false
          fi

      - name: Pack npm packages
        working-directory: apps/cli
        run: bun scripts/pack-npm.ts

      # Trusted publishing (OIDC through `id-token: write`, provenance included), so no token: each package names this
      # workflow as its trusted publisher (`monorepo.md`). Platform packages first, so the main package never points at a
      # version that is not on npm yet. A version already on npm is skipped, so a rerun finishes what a failed one started.
      - name: Publish to npm
        working-directory: apps/cli/dist/npm
        run: |
          for package in @tamery/*/ tamery/; do
            name=$(jq -r .name "$package/package.json")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
            else
              npm publish "./$package" --access public --tag "$NPM_TAG"
            fi
          done
