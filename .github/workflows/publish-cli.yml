name: Build and publish CLI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    # macOS, so the darwin-arm64 binary is re-signed and smoke-tested natively.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm i --frozen-lockfile --ignore-scripts

      - run: pnpm run check

      - name: Test
        working-directory: apps/cli
        run: bun test

      - name: Build every target
        working-directory: apps/cli
        run: bun scripts/build.ts --all
        env:
          API_URL: ${{ secrets.API_URL }}
          MAIN_URL: ${{ secrets.MAIN_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}

      - name: Sign macOS binaries (ad hoc) and smoke-test
        id: version
        working-directory: apps/cli/dist
        run: |
          codesign --force --sign - tamery-darwin-arm64 tamery-darwin-x64
          version=$(jq -r .version ../package.json)
          test "$(./tamery-darwin-arm64 --version)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write checksums
        working-directory: apps/cli/dist
        run: shasum -a 256 tamery-* > checksums.txt

      # Before npm: the install scripts read the version from npm and download it from this release.
      - name: Create GitHub release
        working-directory: apps/cli/dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # --latest=false: the desktop app's releases live in this repo and stay the latest.
        run: |
          gh release create "cli-v$VERSION" tamery-* checksums.txt \
            --target "$GITHUB_SHA" \
            --title "Tamery CLI $VERSION" \
            --notes "Install or update: \`curl -fsSL https://tamery.app/cli/install.sh | sh\` (macOS, Linux), \`irm https://tamery.app/cli/install.ps1 | iex\` (Windows) or \`npm i -g tamery\`." \
            --latest=false

      - name: Pack npm packages
        working-directory: apps/cli
        run: bun scripts/pack-npm.ts

      # Platform packages first, so the main package never points at a version that is not on npm yet.
      - name: Publish to npm
        working-directory: apps/cli/dist/npm
        run: |
          for package in tamery-*/; do
            npm publish "./$package" --provenance --access public
          done
          npm publish ./tamery --provenance --access public
