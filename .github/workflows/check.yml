name: Check

on:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --diff-filter=d --name-only "$BASE_SHA...HEAD" -- 'packages/db/migrations/*/migration.sql' \
            | xargs -r npx --yes squawk-cli@2.70.0 --config=packages/db/.squawk.toml

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint and format
        run: pnpm run check

      - name: Type-check
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

      - name: Report all advisories
        if: always()
        run: pnpm audit || true
