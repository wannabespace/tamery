name: Infra

on:
  push:
    branches:
      - main
    paths:
      - infra/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_alerts_email: ${{ secrets.TF_VAR_ALERTS_EMAIL }}
  TF_VAR_sql_authorized_networks: ${{ secrets.TF_VAR_SQL_AUTHORIZED_NETWORKS }}
  # tamery-tofu may only update existing Cloud Run services and jobs (monorepo.md), and the apply job runs only on the changes the plan job showed.
  BEYOND_CLOUD_RUN: '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | select((.type | IN("google_cloud_run_v2_service", "google_cloud_run_v2_job")) and .change.actions == ["update"] | not) | .address'
  CHANGES: '[.resource_changes[] | select(.change.actions != ["no-op"]) | {address, change: (.change | {actions, before, after, after_unknown})}] | sort_by(.address)'

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apply: ${{ steps.plan.outputs.apply }}
      digest: ${{ steps.plan.outputs.digest }}
    env:
      ACCOUNT: tamery-tofu-plan
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &authenticate
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1095635632709/locations/global/workloadIdentityPools/github-infra/providers/github
          service_account: ${{ env.ACCOUNT }}@gen-lang-client-0721016191.iam.gserviceaccount.com

      - &setup-tofu
        name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - &init
        name: Init
        run: tofu init -input=false

      # The plan account can only read the state, so it cannot take the lock.
      - name: Plan
        id: plan
        run: |
          code=0
          tofu plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt || code=$?
          cat plan.txt
          {
            echo "### $(grep -E '^(Plan:|No changes)' plan.txt || echo 'Plan failed')"
            grep -E '^  # [^(]' plan.txt | sed -E 's/^  # (.*)$/- `\1`/; /destroyed|replaced/s/^- /- ⚠️ /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" != 1 ]
          [ "$code" = 2 ] || exit 0
          tofu show -json tfplan > plan.json
          beyond=$(jq -r "$BEYOND_CLOUD_RUN" plan.json)
          if [ -n "$beyond" ]; then
            echo "**Not applied here:** it changes more than Cloud Run service and job updates (`$(echo $beyond)`). Apply it from Cloud Shell (`.agents/rules/monorepo.md` → Deploys)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "apply=true" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -cS "$CHANGES" plan.json | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # Approving the infra environment is what lets this job sign in as tamery-tofu: review the plan job's log first.
  apply:
    needs: plan
    if: needs.plan.outputs.apply == 'true'
    runs-on: ubuntu-latest
    environment: infra
    env:
      ACCOUNT: tamery-tofu
    steps:
      - *checkout

      - *authenticate
      - *setup-tofu
      - *init

      - name: Plan
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Check it is the approved plan
        env:
          APPROVED: ${{ needs.plan.outputs.digest }}
        run: |
          digest=$(tofu show -json tfplan | jq -cS "$CHANGES" | sha256sum | cut -d' ' -f1)
          [ "$digest" = "$APPROVED" ] || { echo "::error::The plan changed since it was approved. Re-run the workflow to plan again."; exit 1; }

      - name: Apply
        run: tofu apply -input=false -no-color tfplan
