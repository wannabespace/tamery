name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ToDesktop
        run: pnpm run build:todesktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TODESKTOP_ACCESS_TOKEN: ${{ secrets.TODESKTOP_ACCESS_TOKEN }}
          TODESKTOP_EMAIL: ${{ secrets.TODESKTOP_EMAIL }}
          VITE_PUBLIC_API_URL: ${{ secrets.API_URL }}
          VITE_PUBLIC_WEB_URL: ${{ secrets.WEB_URL }}
          VITE_PUBLIC_PROXY_URL: ${{ secrets.PROXY_URL }}
          VITE_PUBLIC_SHARE_URL: ${{ secrets.SHARE_URL }}
          VITE_PUBLIC_POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          VITE_PUBLIC_MAIN_URL: ${{ secrets.MAIN_URL }}
